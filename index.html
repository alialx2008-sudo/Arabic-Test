function QuestionCard({q,idx,answer,onAnswer}){
  const [revealed,setRevealed]=useState(false);
  return(
    <div style={{background:"#1e2a3a",borderRadius:12,padding:20,marginBottom:16,border:"1px solid #2d4a6b"}}>
      <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"flex-start"}}>
        <span style={{background:"#4a90d9",color:"#fff",borderRadius:"50%",width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0}}>{idx+1}</span>
        <p style={{color:"#e9ecef",margin:0,fontSize:14,lineHeight:1.9,fontWeight:500}}>{q.text}</p>
        {q.marks&&<span style={{background:"#16213e",border:"1px solid #4a90d9",color:"#90c5f7",borderRadius:20,padding:"2px 10px",fontSize:11,flexShrink:0}}>{q.marks} درجات</span>}
      </div>
      {q.type==="written"?(
        <div>
          <textarea placeholder="اكتب إجابتك هنا..." style={{width:"100%",minHeight:90,background:"#16213e",border:"1px solid #2d4a6b",borderRadius:8,padding:12,color:"#e9ecef",fontSize:13,direction:"rtl",resize:"vertical",boxSizing:"border-box",fontFamily:"inherit"}}/>
          <details style={{marginTop:8}}>
            <summary style={{color:"#4a90d9",cursor:"pointer",fontSize:12}}>📋 عرض الإجابة النموذجية</summary>
            <div style={{background:"#1a2a3a",padding:12,borderRadius:8,marginTop:6,color:"#90c5f7",fontSize:13,lineHeight:1.8}}>{q.model}</div>
          </details>
        </div>
      ):(
        <div style={{display:"grid",gap:8}}>
          {q.opts.map((opt,i)=>{
            const sel=answer===i,cor=i===q.correct;
            let bg="#16213e",brd="#2d4a6b",col="#adb5bd";
            if(revealed){if(cor){bg="#1a472a";brd="#40916c";col="#b7e4c7";}else if(sel&&!cor){bg="#4a1122";brd="#e63946";col="#ffc8c8";}}
            else if(sel){bg="#1e3a5f";brd="#4a90d9";col="#90c5f7";}
            return(
              <div key={i} onClick={()=>!revealed&&onAnswer(i)}
                style={{background:bg,border:`2px solid ${brd}`,borderRadius:8,padding:"10px 14px",cursor:revealed?"default":"pointer",color:col,fontSize:13,transition:"all .2s",display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontWeight:700,color:brd,flexShrink:0}}>{"أ ب ج د".split(" ")[i]}.</span>{opt}
              </div>
            );
          })}
          {!revealed&&answer!==undefined&&(
            <button onClick={()=>setRevealed(true)} style={{marginTop:6,background:"#4a90d9",color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",cursor:"pointer",fontSize:12,alignSelf:"flex-start"}}>تحقق ✓</button>
          )}
          {revealed&&(
            <div style={{background:answer===q.correct?"#1a472a":"#4a1122",border:`1px solid ${answer===q.correct?"#40916c":"#e63946"}`,borderRadius:8,padding:10,fontSize:12,color:answer===q.correct?"#b7e4c7":"#ffc8c8",lineHeight:1.8}}>
              {answer===q.correct?"✅ صحيح! ":"❌ خطأ. "}{q.fb}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function Section({icon,title,color,children}){
  return(
    <div style={{marginBottom:28}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <span style={{fontSize:20}}>{icon}</span>
        <h2 style={{color:color||"#f0c040",margin:0,fontSize:18,fontWeight:700}}>{title}</h2>
        <div style={{flex:1,height:2,background:`linear-gradient(90deg,${color||"#f0c040"}44,transparent)`}}/>
      </div>
      {children}
    </div>
  );
}

function TextBox({text,borderColor}){
  return(
    <div style={{background:"#1a2a3a",borderRadius:12,padding:18,marginBottom:20,borderRight:`4px solid ${borderColor||"#40916c"}`}}>
      <p style={{color:"#d4e6f1",margin:0,lineHeight:2,fontSize:14,whiteSpace:"pre-line"}}>{text}</p>
    </div>
  );
}

function TrainingView({model,onBack}){
  const [answers,setAnswers]=useState({});
  const set=(key,v)=>setAnswers(p=>({...p,[key]:v}));
  return(
    <div style={{maxWidth:860,margin:"0 auto",padding:"0 16px"}}>
      <button onClick={onBack} style={{background:"none",border:"1px solid #4a90d9",color:"#4a90d9",borderRadius:8,padding:"7px 16px",cursor:"pointer",marginBottom:20,fontSize:13}}>← العودة للرئيسية</button>
      <div style={{background:"linear-gradient(135deg,#1a472a,#2d6a4f)",borderRadius:16,padding:24,marginBottom:28}}>
        <h1 style={{color:"#f0c040",margin:"0 0 6px",fontSize:22}}>{model.title}</h1>
        <p style={{color:"#b7e4c7",margin:0,fontSize:13}}>{model.subtitle}</p>
      </div>
      <Section icon="📖" title={`رواية الصقر – ${model.novelChapter}`} color="#40916c">
        <TextBox text={model.novelText} borderColor="#40916c"/>
        {model.novelQs.map((q,i)=><QuestionCard key={q.id} q={q} idx={i} answer={answers[`n${q.id}`]} onAnswer={v=>set(`n${q.id}`,v)}/>)}
      </Section>
      <Section icon="📰" title={`نص معلوماتي خارجي: ${model.extTitle}`} color="#4a90d9">
        <TextBox text={model.extText} borderColor="#4a90d9"/>
        {model.extQs.map((q,i)=><QuestionCard key={q.id} q={q} idx={i} answer={answers[`e${q.id}`]} onAnswer={v=>set(`e${q.id}`,v)}/>)}
      </Section>
      <Section icon="🎭" title={`شعر خارجي: ${model.poemTitle}`} color="#f0c040">
        <div style={{background:"#16213e",borderRadius:12,padding:22,marginBottom:20,borderRight:"4px solid #f0c040",textAlign:"center"}}>
          <p style={{color:"#f0c040",margin:0,lineHeight:2.6,fontSize:16,fontFamily:"Georgia,serif",whiteSpace:"pre-line"}}>{model.poemText}</p>
        </div>
        {model.poemQs.map((q,i)=><QuestionCard key={q.id} q={q} idx={i} answer={answers[`p${q.id}`]} onAnswer={v=>set(`p${q.id}`,v)}/>)}
      </Section>
      <Section icon="✏️" title={`تطبيق نحوي: ${model.gramTitle}`} color="#90e0a0">
        <TextBox text={model.gramText} borderColor="#90e0a0"/>
        {model.gramQs.map((q,i)=><QuestionCard key={q.id} q={q} idx={i} answer={answers[`g${q.id}`]} onAnswer={v=>set(`g${q.id}`,v)}/>)}
      </Section>
    </div>
  );
}

function ExamView({model,onBack}){
  const [phase,setPhase]=useState("intro");
  const [answers,setAnswers]=useState({});
  const [timeLeft,setTimeLeft]=useState(7200);
  const timerRef=useRef(null);
  const set=(id,v)=>setAnswers(p=>({...p,[id]:v}));

  useEffect(()=>{
    if(phase==="exam"){
      timerRef.current=setInterval(()=>setTimeLeft(t=>{if(t<=1){clearInterval(timerRef.current);setPhase("result");return 0;}return t-1;}),1000);
    }
    return()=>clearInterval(timerRef.current);
  },[phase]);

  const allMCQ=[...model.novelQs,...model.extQs,...model.poemQs].filter(q=>q.type!=="written");
  const correctCount=allMCQ.filter(q=>answers[q.id]===q.correct).length;
  const totalMarks=allMCQ.reduce((s,q)=>s+(q.marks||4),0);
  const score=allMCQ.reduce((s,q)=>answers[q.id]===q.correct?s+(q.marks||4):s,0);
  const pct=Math.round(score/totalMarks*100);
  const mm=Math.floor(timeLeft/60).toString().padStart(2,"0");
  const ss=(timeLeft%60).toString().padStart(2,"0");

  if(phase==="intro") return(
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 16px"}}>
      <button onClick={onBack} style={{background:"none",border:"1px solid #4a90d9",color:"#4a90d9",borderRadius:8,padding:"7px 16px",cursor:"pointer",marginBottom:20,fontSize:13}}>← العودة</button>
      <div style={{background:"#1e2a3a",borderRadius:20,padding:32,textAlign:"center"}}>
        <div style={{fontSize:52,marginBottom:12}}>📝</div>
        <h1 style={{color:"#f0c040",fontSize:24,margin:"0 0 6px",fontFamily:"Georgia,serif"}}>{model.title}</h1>
        <p style={{color:"#adb5bd",margin:"0 0 24px"}}>اللغة العربية – الصف الثاني عشر</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:24}}>
          {[["⏱ المدة",model.duration],["📊 الدرجة الكلية",model.totalMarks+" درجة"],["❓ عدد الأسئلة",allMCQ.length+" سؤالاً"],["📅 المادة","اللغة العربية"]].map(([l,v])=>(
            <div key={l} style={{background:"#16213e",borderRadius:10,padding:14}}>
              <div style={{color:"#f0c040",marginBottom:4}}>{l}</div>
              <div style={{color:"#e9ecef",fontWeight:700}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{background:"#16213e",borderRadius:10,padding:16,marginBottom:20,textAlign:"right"}}>
          <h3 style={{color:"#f0c040",margin:"0 0 10px",fontSize:14}}>تعليمات الاختبار</h3>
          {["اقرأ كل سؤال بعناية قبل الإجابة","لكل سؤال إجابة صحيحة واحدة فقط","يمكنك مراجعة إجاباتك قبل التسليم","المدة الزمنية ساعتان كاملتان","استعن بالنصوص المرفقة للإجابة"].map((t,i)=>(
            <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:6,color:"#d4e6f1",fontSize:13}}>
              <span style={{color:"#40916c",fontWeight:700}}>✓</span>{t}
            </div>
          ))}
        </div>
        <button onClick={()=>setPhase("exam")} style={{width:"100%",background:"linear-gradient(135deg,#1a1a2e,#16213e)",border:"2px solid #4a90d9",color:"#90c5f7",borderRadius:12,padding:14,fontSize:15,cursor:"pointer",fontWeight:700}}>
          ابدأ الاختبار الآن ←
        </button>
      </div>
    </div>
  );

  if(phase==="result") return(
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 16px",textAlign:"center"}}>
      <div style={{background:"#1e2a3a",borderRadius:20,padding:36}}>
        <div style={{fontSize:60,marginBottom:12}}>{pct>=80?"🏆":pct>=60?"📚":"💪"}</div>
        <h1 style={{color:"#f0c040",fontSize:26,margin:"0 0 16px",fontFamily:"Georgia,serif"}}>نتيجة الاختبار</h1>
        <div style={{fontSize:52,fontWeight:900,color:pct>=80?"#40916c":pct>=60?"#f0c040":"#e63946",margin:"0 0 8px"}}>{score} / {totalMarks}</div>
        <div style={{fontSize:24,color:pct>=80?"#40916c":pct>=60?"#f0c040":"#e63946",marginBottom:8}}>{pct}%</div>
        <p style={{color:"#adb5bd",marginBottom:24}}>{pct>=80?"ممتاز! أداء رائع 🌟":pct>=60?"جيد جداً، واصل التحسين 📖":"تحتاج إلى مزيد من المراجعة 💡"}</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:24}}>
          {[["صحيح",allMCQ.filter(q=>answers[q.id]===q.correct).length,"#40916c"],["خاطئ",allMCQ.filter(q=>answers[q.id]!==undefined&&answers[q.id]!==q.correct).length,"#e63946"],["لم تُجب",allMCQ.filter(q=>answers[q.id]===undefined).length,"#adb5bd"]].map(([l,v,c])=>(
            <div key={l} style={{background:"#16213e",borderRadius:10,padding:14}}>
              <div style={{fontSize:22,fontWeight:700,color:c}}>{v}</div>
              <div style={{color:"#adb5bd",fontSize:11,marginTop:3}}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"center"}}>
          <button onClick={()=>{setPhase("intro");setAnswers({});setTimeLeft(7200);}} style={{background:"#4a90d9",color:"#fff",border:"none",borderRadius:10,padding:"10px 22px",cursor:"pointer",fontSize:13}}>إعادة الاختبار</button>
          <button onClick={onBack} style={{background:"none",border:"1px solid #adb5bd",color:"#adb5bd",borderRadius:10,padding:"10px 22px",cursor:"pointer",fontSize:13}}>العودة للقائمة</button>
        </div>
      </div>
    </div>
  );

  return(
    <div style={{maxWidth:860,margin:"0 auto",padding:"0 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,position:"sticky",top:0,background:"#0d1117",padding:"12px 0",zIndex:10,borderBottom:"1px solid #2d4a6b"}}>
        <h2 style={{color:"#f0c040",margin:0,fontSize:18}}>{model.title}</h2>
        <div style={{background:"#1e2a3a",border:"1px solid #4a90d9",borderRadius:8,padding:"6px 14px",color:timeLeft<300?"#e63946":"#90c5f7",fontFamily:"monospace",fontSize:18,fontWeight:700}}>
          ⏱ {mm}:{ss}
        </div>
      </div>
      <Section icon="📖" title="أسئلة رواية الصقر" color="#40916c">
        <TextBox text={model.novelText} borderColor="#40916c"/>
        {model.novelQs.map((q,i)=><QuestionCard key={q.id} q={q} idx={i} answer={answers[q.id]} onAnswer={v=>set(q.id,v)}/>)}
      </Section>
      <Section icon="📰" title={`نص معلوماتي: ${model.extTitle}`} color="#4a90d9">
        <TextBox text={model.extText} borderColor="#4a90d9"/>
        {model.extQs.map((q,i)=><QuestionCard key={q.id} q={q} idx={i} answer={answers[q.id]} onAnswer={v=>set(q.id,v)}/>)}
      </Section>
      <Section icon="🎭" title={`نص شعري: ${model.poemTitle}`} color="#f0c040">
        <div style={{background:"#16213e",borderRadius:12,padding:22,marginBottom:20,borderRight:"4px solid #f0c040",textAlign:"center"}}>
          <p style={{color:"#f0c040",margin:0,lineHeight:2.6,fontSize:15,fontFamily:"Georgia,serif",whiteSpace:"pre-line"}}>{model.poemText}</p>
        </div>
        {model.poemQs.map((q,i)=><QuestionCard key={q.id} q={q} idx={i} answer={answers[q.id]} onAnswer={v=>set(q.id,v)}/>)}
      </Section>
      <div style={{textAlign:"center",marginBottom:40,paddingTop:10}}>
        <button onClick={()=>{clearInterval(timerRef.current);setPhase("result");}}
          style={{background:"linear-gradient(135deg,#1a472a,#2d6a4f)",border:"2px solid #40916c",color:"#b7e4c7",borderRadius:12,padding:"14px 44px",fontSize:15,cursor:"pointer",fontWeight:700}}>
          تسليم الاختبار وعرض النتيجة ✓
        </button>
      </div>
    </div>
  );
}

function ModelCard({model,type,onClick}){
  const ready=(type==="training"&&model.novelQs)||(type==="exam"&&model.novelQs);
  return(
    <div onClick={onClick}
      style={{background:type==="training"?"linear-gradient(135deg,#1a472a,#2d6a4f)":"linear-gradient(135deg,#1a1a2e,#16213e)",
        border:`2px solid ${type==="training"?"#40916c":"#4a90d9"}`,borderRadius:14,padding:20,cursor:"pointer",transition:"all .3s",position:"relative",overflow:"hidden"}}
      onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-4px)";e.currentTarget.style.boxShadow=`0 10px 30px ${type==="training"?"#40916c33":"#4a90d933"}`}}
      onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="none"}}>
      <div style={{fontSize:26,marginBottom:8}}>{type==="training"?"📚":"📝"}</div>
      <h3 style={{color:"#f8f9fa",margin:"0 0 5px",fontSize:15,fontWeight:700}}>{model.title}</h3>
      <p style={{color:"#adb5bd",margin:0,fontSize:11,lineHeight:1.6}}>{model.subtitle||model.duration+" | "+model.totalMarks+" درجة"}</p>
      <div style={{position:"absolute",top:10,left:10,background:ready?"#40916c":"#495057",color:"#fff",borderRadius:20,padding:"3px 10px",fontSize:10}}>
        {ready?(type==="training"?"جاهز":"جاهز"):"قريباً"}
      </div>
    </div>
  );
}

function App(){
  const [view,setView]=useState("home");
  const [selected,setSelected]=useState(null);
  const [viewType,setViewType]=useState(null);
  const [tab,setTab]=useState("training");

  const openModel=(model,type)=>{
    if((type==="training"&&!model.novelQs)||(type==="exam"&&!model.novelQs)){
      alert(`هذا النموذج قيد الإعداد وسيتوفر قريباً ✏️`);
      return;
    }
    setSelected(model);setViewType(type);setView("detail");
  };

  const back=()=>{setView("home");setSelected(null);setViewType(null);};

  if(view==="detail"&&selected){
    return(
      <div style={{minHeight:"100vh",background:"#0d1117",padding:"24px 16px"}}>
        {viewType==="training"?<TrainingView model={selected} onBack={back}/>:<ExamView model={selected} onBack={back}/>}
      </div>
    );
  }

  return(
    <div style={{minHeight:"100vh",background:"#0d1117",padding:"20px 16px",direction:"rtl"}}>
      <div style={{maxWidth:1100,margin:"0 auto"}}>
        {/* HEADER */}
        <div style={{background:"linear-gradient(135deg,#0d1b2a,#1a1a2e,#16213e)",borderRadius:20,padding:28,textAlign:"center",marginBottom:28,border:"1px solid #2d4a6b",position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",top:0,left:0,right:0,height:4,background:"linear-gradient(90deg,#40916c,#f0c040,#4a90d9)"}}/>
          <div style={{fontSize:44,marginBottom:10}}>🦅</div>
          <h1 style={{color:"#f0c040",margin:"0 0 6px",fontSize:26,fontFamily:"Georgia,serif"}}>ملف التدريب الإلكتروني – اللغة العربية</h1>
          <p style={{color:"#90c5f7",margin:"0 0 3px",fontSize:15}}>الصف الثاني عشر | رواية الصقر · التطبيقات النحوية · الشعر والنثر</p>
          <p style={{color:"#6c757d",margin:0,fontSize:12}}>١٠ نماذج تدريبية · ١٠ نماذج اختبار احترافية · وفق هيكل الامتحان الرسمي</p>
        </div>
        {/* STATS */}
        <div className="grid-4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:24}}>
          {[["📚","١٠","نماذج تدريبية"],["📝","١٠","نماذج اختبار"],["🎯","٢٥","سؤالاً لكل نموذج"],["⭐","١٠٠","درجة الاختبار"]].map(([i,n,l])=>(
            <div key={l} style={{background:"#1e2a3a",borderRadius:12,padding:16,textAlign:"center",border:"1px solid #2d4a6b"}}>
              <div style={{fontSize:22,marginBottom:6}}>{i}</div>
              <div style={{color:"#f0c040",fontSize:26,fontWeight:900}}>{n}</div>
              <div style={{color:"#adb5bd",fontSize:11,marginTop:3}}>{l}</div>
            </div>
          ))}
        </div>
        {/* TABS */}
        <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:20}}>
          {[["training","📚","نماذج التدريب"],["exam","📝","نماذج الاختبار"]].map(([id,ico,lbl])=>(
            <button key={id} onClick={()=>setTab(id)} style={{background:tab===id?(id==="training"?"linear-gradient(135deg,#1a472a,#2d6a4f)":"linear-gradient(135deg,#1a1a2e,#16213e)"):"#1e2a3a",
              border:`2px solid ${tab===id?(id==="training"?"#40916c":"#4a90d9"):"#2d4a6b"}`,color:tab===id?"#fff":"#adb5bd",
              borderRadius:10,padding:"10px 28px",cursor:"pointer",fontSize:14,fontWeight:700,transition:"all .3s"}}>
              {ico} {lbl}
            </button>
          ))}
        </div>
        {/* INFO BAR */}
        <div style={{background:"#1e2a3a",borderRadius:10,padding:"12px 16px",marginBottom:16,border:`1px solid ${tab==="training"?"#40916c":"#4a90d9"}`}}>
          <p style={{color:tab==="training"?"#b7e4c7":"#90c5f7",margin:0,fontSize:12,lineHeight:1.8}}>
            <strong style={{color:"#f0c040"}}>{tab==="training"?"هيكل النموذج التدريبي: ":"هيكل نموذج الاختبار: "}</strong>
            {tab==="training"
              ?"كل نموذج: نص رواية الصقر (٣ أسئلة) + نص معلوماتي خارجي (٥ أسئلة) + قصيدة شعرية خارجية (٢ سؤال) + تطبيق نحوي (٢ سؤال) = ١٢ سؤالاً وفق هيكل الامتحان."
              :"كل نموذج: أسئلة الرواية ٥×٤=٢٠ + أسئلة النص المعلوماتي ٥×٤=٢٠ + الشعر ٢×٤=٨ + جزء مكتوب ٢٠ = ١٠٠ درجة | مدة ساعتان."}
          </p>
        </div>
        {/* GRID */}
        <div className="grid-cards" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14,marginBottom:32}}>
          {(tab==="training"?MODELS_DATA.training:MODELS_DATA.exams).map(m=>(
            <ModelCard key={m.id} model={m} type={tab} onClick={()=>openModel(m,tab)}/>
          ))}
        </div>
        {/* FOOTER */}
        <div style={{textAlign:"center",paddingTop:8}}>
          <p style={{color:"#495057",fontSize:11}}>ملف التدريب الإلكتروني – اللغة العربية الصف الثاني عشر | وفق هيكل الامتحان الرسمي</p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
